[project]
name = "td-watson"
version = "3.0.1"
description = "A wonderful CLI to track your time!"
authors = [
  { name = "Yannick Péroux", email = "yannick.peroux@gmail.com" },
  { name = "Julien Maupetit", email = "julien@maupetit.net" },
  { name = "William Durand" },
  { name = "Christopher Arndt", email = "chris@chrisarndt.de" },
]
maintainers = [
  { name = "Julien Maupetit", email = "julien@maupetit.net" },
]
readme = "README.md"
requires-python = ">=3.11,<4.0.0"
license = "MIT"
keywords=[
  "watson",
  "time-tracking",
  "time tracking",
  "monitoring", 
  "report",
  "CLI"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Customer Service",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Other Audience",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]

dependencies = [
    "arrow>=1.4.0",
    "click>=8.3.1",
    "click-didyoumean>=0.3.1",
    "colorama>=0.4.6",
    "requests>=2.32.5",
]

[project.urls]
Repository = "https://github.com/jmaupetit/Watson"

[project.scripts]
watson = "watson.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watson"]

[dependency-groups]
dev = [
    "codespell>=2.4,<3",
    "mkdocs>=1.6.1",
    "mkdocs-bootswatch>=1.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-datafiles>=3.0.0",
    "pytest-mock>=3.15.1",
    "pytest-runner>=6.0.1",
    "ruff>=0.17.6",
    "rumdl>=0.3.5,<0.4",
]

[tool.codespell]
skip = "*.lock,*.gif,*.svg,*.json,./site,./htmlcov,./.coverage,./.venv*,./.git,./.*_cache"
check-hidden = true

[tool.coverage.run]
source = ["watson"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
# Exclude a variety of commonly ignored directories.
exclude = []

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",  # pydocstyle
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # Isort
    "ISC",  # flake8-implicit-str-concat
    "PLC",  # Pylint Convention
    "PLE",  # Pylint Error
    "PLR",  # Pylint Refactor
    "PLW",  # Pylint Warning
    "RUF100",  # Ruff unused-noqa
    "S",  # flake8-bandit
    "T20", # flake8-print
    "W",  # pycodestyle warning
]

[tool.ruff.lint.per-file-ignores]
"scripts/fuzzer.py" = [
    "S311",  # pseudo-random generators are fine to generate fake data
]
"tests/*" = [
    "PLR2004",  # magic value comparison
    "S101",  # use of assert
]
"watson/cli.py" = [
    "D301",  # click relies on "\b" escape sequences in docstrings
    "D412",  # click needs a blank line before "\b" blocks in docstrings
    "PLR0913",  # click commands have many options
    "PLR0917",  # click commands have many options
]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.rumdl]
line-length = 80
disable = [
    "MD014",  # shell examples intentionally keep their "$" prompt
]
exclude = [
    "AGENTS.md",  # agent instructions, not project documentation
]
respect-gitignore = true

[tool.rumdl.per-file-flavor]
"docs/**/*.md" = "mkdocs"

[tool.rumdl.per-file-ignores]
# GitHub renders single newlines in issue and PR bodies as line breaks
".github/ISSUE_TEMPLATE/*.md" = ["MD013", "MD036", "MD041"]
".github/pull_request_template.md" = ["MD013", "MD041"]
# Both pages start with a logo rather than a level 1 heading
"README.md" = ["MD041"]
"docs/index.md" = ["MD041"]
# Generated by scripts/gen-cli-docs.py. It stays in the lint scope so that MD057
# can resolve links to it, but its generated formatting is left untouched.
"docs/user-guide/commands.md" = ["MD009", "MD012", "MD013", "MD022", "MD046"]

[tool.rumdl.MD013]
line-length = 80
reflow = true
code-blocks = false
tables = false
headings = false

[tool.rumdl.MD026]
punctuation = ".,;:"  # allow headings such as "Get started!"
